name: BingX Daytrade Alert

on:
  schedule:
    # A GitHub saját cron-ütemezése NEM megbízható 5-10 perces
    # intervallumoknál - a VALÓDI 10 perces ütemezést egy külső
    # cron-szolgáltatásnak (cron-job.org) kell adnia, workflow_dispatch-en
    # keresztül. A GitHub saját "schedule"-je itt csak ÓRÁNKÉNTI
    # BIZTONSÁGI HÁLÓ.
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bingx-daytrade-checker
  cancel-in-progress: false

permissions:
  contents: write

# ÚJ: lásd az alert_checker.yml-ben lévő azonos blokk-kommentet - mindkét
# bot KÜLÖN branch-re ír (ez itt: state-daytrade), hogy a git PUSH-szintű
# ütközések a két, egymástól független bot között megszűnjenek.

env:
  STATE_BRANCH: state-daytrade

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repó checkout
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-alerts.txt

      - name: Csomagok telepítése
        run: pip install aiohttp pandas requests

      - name: Állapotfájlok betöltése a ${{ env.STATE_BRANCH }} branch-ről
        run: |
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$STATE_BRANCH"
            git worktree add --detach /tmp/state-load "origin/$STATE_BRANCH"
            find /tmp/state-load -maxdepth 1 -type f \( -name '*.json' -o -name '*.jsonl' -o -name '*.jsonl.bak' \) -exec cp {} . \;
            git worktree remove /tmp/state-load --force
            echo "Állapot betöltve a $STATE_BRANCH branch-ről."
          else
            echo "Még nincs $STATE_BRANCH branch - első futás, üres állapotból indulunk."
          fi

      - name: Másik két bot jelzéseinek betöltése (csak olvasásra, bot-közi megerősítéshez)
        run: |
          for branch in state-scalp state-cascade; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch origin "$branch"
              git worktree add --detach "/tmp/cross-$branch" "origin/$branch"
              find "/tmp/cross-$branch" -maxdepth 1 -type f -name '*_recent_signals.jsonl' -exec cp {} . \;
              git worktree remove "/tmp/cross-$branch" --force
            else
              echo "A $branch branch még nem létezik - a másik bot még nem futott, kihagyva."
            fi
          done

      - name: Daytrade Ellenőrzés futtatása
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ÚJ: websocket élő gyertya-figyelő ki/be kapcsolója - lásd az
          # alert_checker.yml azonos kommentjét. Repository Variable-ként
          # állítható: Settings -> Secrets and variables -> Actions ->
          # Variables fül -> USE_WEBSOCKET_KLINES = true / false. Ha a
          # Variable nincs beállítva, üres stringet ad vissza, amit a
          # szkript "false"-ként kezel - tehát amíg nem hozod létre
          # kifejezetten, a bot változatlanul REST-alapon fut.
          USE_WEBSOCKET_KLINES: ${{ vars.USE_WEBSOCKET_KLINES }}
        run: python daytrade_checker.py

      - name: Állapotfájlok visszamentése a ${{ env.STATE_BRANCH }} branch-re
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            rm -rf /tmp/state-save
            if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
              git fetch origin "$STATE_BRANCH"
              git worktree add --detach /tmp/state-save "origin/$STATE_BRANCH"
            else
              git worktree add --detach /tmp/state-save
              (cd /tmp/state-save && git checkout --orphan "$STATE_BRANCH" && git rm -rf . >/dev/null 2>&1 || true)
            fi

            cp daytrade_state.json /tmp/state-save/ 2>/dev/null || true
            [ -f daytrade_alert_log.jsonl ] && cp daytrade_alert_log.jsonl /tmp/state-save/
            for f in daytrade_alert_log_*.jsonl.bak; do
              [ -f "$f" ] && cp "$f" /tmp/state-save/
            done
            [ -f daytrade_recent_signals.jsonl ] && cp daytrade_recent_signals.jsonl /tmp/state-save/

            cd /tmp/state-save
            git add -A
            if git diff --quiet --cached; then
              echo "Nincs változás a daytrade állapotfájlokban, nincs mit commitolni."
              cd "$GITHUB_WORKSPACE"
              git worktree remove /tmp/state-save --force
              exit 0
            fi
            git commit -m "daytrade_state / daytrade_alert_log frissítve [skip ci]"

            if git push origin "HEAD:$STATE_BRANCH"; then
              echo "Push sikeres."
              cd "$GITHUB_WORKSPACE"
              git worktree remove /tmp/state-save --force
              exit 0
            fi

            echo "Push ütközött (${i}. próbálkozás) - újrapróbálás..."
            cd "$GITHUB_WORKSPACE"
            git worktree remove /tmp/state-save --force
            sleep $((RANDOM % 6 + 3))
          done
          echo "Push végül sem sikerült 5 próbálkozás után."
