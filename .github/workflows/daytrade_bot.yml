name: Daytrade Bot Runner

on:
  schedule:
    # 10 percenként indul, ahogy a skalp bot is
    - cron: '*/10 * * * *'
  workflow_dispatch: # Lehetővé teszi a manuális indítást gombnyomásra

jobs:
  run-daytrade-bot:
    runs-on: ubuntu-latest
    concurrency: 
      group: daytrade-bot
      cancel-in-progress: false # A Python kód belső lockja úgyis kezeli az átfedést

    steps:
      - name: Kód letöltése (Checkout)
        uses: actions/checkout@v3

      - name: Python 3.10 beállítása
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Függőségek (csomagok) telepítése
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pandas requests

      - name: Daytrade Bot futtatása
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daytrade_checker.py
