name: BingX Breakout Alert

on:
  schedule:
    - cron: "0 * * * *"   # óránként egyszer, csak biztonsági hálóként
  workflow_dispatch: {}   # ezt hívja a külső cron-szolgáltatás API-n keresztül,
                           # és ezzel kézzel is elindítható a "Actions" fülön

concurrency:
  group: bingx-alert-checker
  cancel-in-progress: false

permissions:
  contents: write

# ÚJ: mostantól az állapot- és naplófájlok NEM a main branch-re mennek,
# hanem egy KÜLÖN, kizárólag ehhez a workflow-hoz tartozó "state-scalp"
# branch-re. Ennek oka: mind a scalp, mind a daytrade bot ugyanabba a
# repóba, korábban ugyanarra a main branch-re pusholt - ez azt jelentette,
# hogy ha a két bot időben közel próbált commitolni, a git PUSH-szintű
# "non-fast-forward" elutasítás miatt (nem tartalmi ütközés, hanem "valaki
# már pusholt közben") mindegyiknek végig kellett futnia a fetch+pull+retry
# ciklusán, ami akár 3+ percet is elvitt egy-egy futásból. Mivel a
# state-scalp branch-et KIZÁRÓLAG ez a workflow írja, ez a fajta ütközés
# mostantól gyakorlatilag megszűnik.

env:
  STATE_BRANCH: state-scalp

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repó checkout
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-alerts.txt

      - name: Csomagok telepítése
        run: pip install -r requirements-alerts.txt

      - name: Állapotfájlok betöltése a ${{ env.STATE_BRANCH }} branch-ről
        run: |
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$STATE_BRANCH"
            git worktree add --detach /tmp/state-load "origin/$STATE_BRANCH"
            find /tmp/state-load -maxdepth 1 -type f \( -name '*.json' -o -name '*.jsonl' -o -name '*.jsonl.bak' \) -exec cp {} . \;
            git worktree remove /tmp/state-load --force
            echo "Állapot betöltve a $STATE_BRANCH branch-ről."
          else
            echo "Még nincs $STATE_BRANCH branch - első futás, üres állapotból indulunk."
          fi

      - name: Másik két bot jelzéseinek betöltése (csak olvasásra, bot-közi megerősítéshez)
        run: |
          # ÚJ: a bot-közi megerősítéshez ez a bot elolvassa (de NEM írja!)
          # a másik két bot "recent_signals" fájlját a SAJÁT state-branch-eikről.
          # Ez azért biztonságos (nincs git-ütközési kockázat), mert csak
          # OLVASUNK egy másik branch-ről - írni továbbra is csak a saját
          # state-scalp branch-re fogunk (lásd a visszamentési lépést lent).
          for branch in state-daytrade state-cascade; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch origin "$branch"
              git worktree add --detach "/tmp/cross-$branch" "origin/$branch"
              find "/tmp/cross-$branch" -maxdepth 1 -type f -name '*_recent_signals.jsonl' -exec cp {} . \;
              git worktree remove "/tmp/cross-$branch" --force
            else
              echo "A $branch branch még nem létezik - a másik bot még nem futott, kihagyva."
            fi
          done

      - name: Ellenőrzés futtatása
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ÚJ: websocket élő gyertya-figyelő ki/be kapcsolója. Repository
          # Variable-ként (NEM Secret, mert nem érzékeny adat) állítható:
          # Settings -> Secrets and variables -> Actions -> Variables fül ->
          # USE_WEBSOCKET_KLINES = true / false. Ha a Variable nincs
          # beállítva, a ${{ vars.USE_WEBSOCKET_KLINES }} üres stringet ad
          # vissza, a szkript pedig ezt "false"-ként kezeli - tehát amíg
          # nem hozod létre a Variable-t, a bot változatlanul REST-alapon fut.
          USE_WEBSOCKET_KLINES: ${{ vars.USE_WEBSOCKET_KLINES }}
        run: python alert_checker.py

      - name: Állapotfájlok visszamentése a ${{ env.STATE_BRANCH }} branch-re
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            rm -rf /tmp/state-save
            if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
              git fetch origin "$STATE_BRANCH"
              git worktree add --detach /tmp/state-save "origin/$STATE_BRANCH"
            else
              git worktree add --detach /tmp/state-save
              (cd /tmp/state-save && git checkout --orphan "$STATE_BRANCH" && git rm -rf . >/dev/null 2>&1 || true)
            fi

            # A friss (a szkript által az ELŐBB frissített) állapotfájlokat
            # másoljuk a worktree-be - ez felülírja, amit a worktree a
            # remote-ról hozott, tehát MINDIG a mi friss verziónk kerül be,
            # függetlenül attól, mi volt korábban ott (ez helyettesíti a
            # korábbi ".gitattributes merge=ours" trükköt - itt nincs is
            # rá szükség, mert nem MERGE-elünk, hanem felülírunk).
            cp alert_state.json /tmp/state-save/ 2>/dev/null || true
            [ -f alert_log.jsonl ] && cp alert_log.jsonl /tmp/state-save/
            for f in alert_log_*.jsonl.bak; do
              [ -f "$f" ] && cp "$f" /tmp/state-save/
            done
            # ÚJ: a SAJÁT kereszt-bot jelzés-fájlunkat is mentjük, hogy a
            # másik két bot a KÖVETKEZŐ futásukban lássa (lásd a fenti
            # "Másik két bot jelzéseinek betöltése" lépést a tükörpárjához).
            [ -f scalp_recent_signals.jsonl ] && cp scalp_recent_signals.jsonl /tmp/state-save/

            cd /tmp/state-save
            git add -A
            if git diff --quiet --cached; then
              echo "Nincs változás az állapotfájlokban, nincs mit commitolni."
              cd "$GITHUB_WORKSPACE"
              git worktree remove /tmp/state-save --force
              exit 0
            fi
            git commit -m "alert_state / alert_log frissítve [skip ci]"

            if git push origin "HEAD:$STATE_BRANCH"; then
              echo "Push sikeres."
              cd "$GITHUB_WORKSPACE"
              git worktree remove /tmp/state-save --force
              exit 0
            fi

            echo "Push ütközött (${i}. próbálkozás) - újrapróbálás..."
            cd "$GITHUB_WORKSPACE"
            git worktree remove /tmp/state-save --force
            sleep $((RANDOM % 6 + 3))
          done
          echo "Push végül sem sikerült 5 próbálkozás után - a state ebben a körben elveszhet, de a következő futás újra megpróbálja."
