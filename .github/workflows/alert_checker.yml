name: BingX Breakout Alert

on:
  schedule:
    # Minden 5. percben lefut. (Megjegyzés: a GitHub "best effort" alapon
    # ütemezi ezt, nagy terhelés esetén pár perc csúszás előfordulhat - ez
    # normális, nem hiba.)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # ezzel kézzel is elindítható a "Actions" fülön, teszteléshez

# Ha egy futás még nem fejeződött be, amikor a következő indulna, az újat
# sorba állítjuk (nem párhuzamosan futtatjuk) - így nem ütközhet két job az
# alert_state.json visszaírásakor.
concurrency:
  group: bingx-alert-checker
  cancel-in-progress: false

permissions:
  contents: write   # kell, hogy a job vissza tudja commitolni az állapotfájlt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repó checkout
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Csomagok telepítése
        run: pip install -r requirements-alerts.txt

      - name: Ellenőrzés futtatása
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert_checker.py

      - name: Állapotfájl visszamentése a repóba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --quiet --cached || git commit -m "alert_state frissítve [skip ci]"
          git push
